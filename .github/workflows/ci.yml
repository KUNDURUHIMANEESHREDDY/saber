name: CI and Security

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: local API and settings checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax-check both server copies
        run: |
          node --check server.js
          node --check static-path.js
          node --check "agent system/server.js"
          node --check public/overlord.js
          node --check "agent system/public/overlord.js"
      - name: Validate settings schema and UI invariants
        run: node test-settings.js
      - name: Test secret redaction and local-only binding
        run: node test-security.js

  secret-scan:
    name: Git history secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Go for the pinned Gitleaks CLI
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.24.2"
          cache: false
      - name: Install pinned Gitleaks
        run: go install github.com/zricethezav/gitleaks/v8@v8.24.3
      - name: Scan Git history without repository credentials
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if [ -n "$BASE_SHA" ] && git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null && git cat-file -e "$HEAD_SHA^{commit}" 2>/dev/null; then
            commit_count="$(git rev-list --count --no-merges "$BASE_SHA..$HEAD_SHA")"
            if [ "$commit_count" -eq 0 ]; then
              echo "::error::No pull-request commits were available for secret scanning." >&2
              exit 1
            fi
            gitleaks detect --source . --redact --exit-code 2 --report-format sarif --report-path results.sarif --log-opts="--no-merges ${BASE_SHA}..${HEAD_SHA}"
          else
            gitleaks detect --source . --redact --exit-code 2 --report-format sarif --report-path results.sarif
          fi
      - name: Preserve redacted secret-scan report
        if: always() && hashFiles('results.sarif') != ''
        uses: actions/upload-artifact@v4
        with:
          name: saber-gitleaks-${{ github.run_id }}
          path: results.sarif
          retention-days: 14

  required:
    name: required
    if: always()
    needs: [verify, secret-scan]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Fail closed on any verification failure
        env:
          VERIFY_RESULT: ${{ needs.verify.result }}
          SECRET_SCAN_RESULT: ${{ needs.secret-scan.result }}
        run: |
          set -euo pipefail
          echo "verify: $VERIFY_RESULT"
          echo "secret-scan: $SECRET_SCAN_RESULT"
          test "$VERIFY_RESULT" = "success"
          test "$SECRET_SCAN_RESULT" = "success"
